server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for fast asset transfer
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Service worker & manifest must never be cached at proxy/browser layer
    location ~* (sw\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Static assets (icons, images) can be cached with revalidation
    location ~* \.(png|ico|svg|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Reverse proxy Firebase Auth handler so authDomain is the app's own domain
    location /__/auth/ {
        proxy_pass https://iron-hope-shop-ff854.firebaseapp.com/__/auth/;
        proxy_set_header Host iron-hope-shop-ff854.firebaseapp.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Fallback to index.html for SPA/PWA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for Cloud Run
    location = /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
